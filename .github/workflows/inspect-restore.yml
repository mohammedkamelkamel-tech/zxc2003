name: Inspect backup restore implementation

on:
  push:
    branches:
      - fix/restore-json-picker
    paths:
      - '.github/workflows/inspect-restore.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect backup restore code
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q zxc2003-15_9-full-backup-custody.zip -d extracted
          echo "=== BackupActivity.java ==="
          sed -n '1,360p' extracted/android_project/app/src/main/java/com/alkamel/distribution/BackupActivity.java
          echo "=== AndroidManifest.xml ==="
          sed -n '1,120p' extracted/android_project/app/src/main/AndroidManifest.xml
          echo "=== Database restore methods ==="
          grep -nE 'restore|import|export|backup|insert|delete|transaction|SQLiteDatabase' extracted/android_project/app/src/main/java/com/alkamel/distribution/database/DatabaseHelper.java | head -180 || true
