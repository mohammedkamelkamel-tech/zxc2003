name: Inspect backup restore implementation

on:
  push:
    branches:
      - fix/restore-json-picker
    paths:
      - '.github/workflows/inspect-restore.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print restore and database import methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q zxc2003-15_9-full-backup-custody.zip -d extracted
          echo "=== BackupActivity restore methods ==="
          sed -n '220,380p' extracted/android_project/app/src/main/java/com/alkamel/distribution/BackupActivity.java
          echo "=== DatabaseHelper import method ==="
          sed -n '300,450p' extracted/android_project/app/src/main/java/com/alkamel/distribution/database/DatabaseHelper.java
