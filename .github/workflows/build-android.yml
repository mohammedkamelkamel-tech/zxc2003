name: Build AlKamel Distribution APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          set -e
          ARCHIVE="al_kamel_distribution_project_fixed_pdf.zip"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE="al_kamel_distribution_project_modified.zip"
          fi
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          if [ -f extracted/android_project/app/build.gradle ]; then
            PROJECT_DIR="extracted/android_project"
          elif [ -f extracted/source/android_project/app/build.gradle ]; then
            PROJECT_DIR="extracted/source/android_project"
          else
            echo "Android project app/build.gradle not found in archive"
            find extracted -maxdepth 5 -name build.gradle -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-distribution-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
