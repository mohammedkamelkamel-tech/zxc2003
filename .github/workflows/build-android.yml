name: Build AlKamel Distribution APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled Android SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept SDK licenses and install required packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Find and extract newest versioned project
        run: |
          set -e
          # Explicitly prioritize the latest user-approved project.
          if [ -f "zxc2003-15_7-unified-dialogs-ui.zip" ]; then
            ARCHIVE="zxc2003-15_7-unified-dialogs-ui.zip"
          elif [ -f "zxc2003-15_6-shop-buttons.zip" ]; then
            ARCHIVE="zxc2003-15_6-shop-buttons.zip"
          elif [ -f "zxc2003-15_5-category-colored-inputs.zip" ]; then
            ARCHIVE="zxc2003-15_5-category-colored-inputs.zip"
          elif [ -f "zxc2003-15_3-final-shop-list-icons.zip" ]; then
            ARCHIVE="zxc2003-15_3-final-shop-list-icons.zip"
          elif [ -f "zxc2003-15_2-fingerprint-fix.zip" ]; then
            ARCHIVE="zxc2003-15_2-fingerprint-fix.zip"
          else
            ARCHIVE="$(find . -maxdepth 1 -type f -name 'zxc2003-*.zip' ! -name '*-fingerprint-fix.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No versioned project archive matching zxc2003-*.zip was found."
            exit 1
          fi
          echo "Selected newest versioned project archive: $ARCHIVE"
          sha256sum "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_BUILD="$(find extracted -path '*/app/build.gradle' -type f | head -n 1)"
          if [ -z "$PROJECT_BUILD" ]; then
            echo "::error::No Android app/build.gradle found in $ARCHIVE"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_BUILD")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-distribution-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
