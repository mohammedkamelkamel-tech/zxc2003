name: Build AlKamel 15.14 - preserve restore fix and restore page-3 card counts

on:
  push:
    branches:
      - fix/restore-json-picker
    paths:
      - '.github/workflows/fix-restore-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-json-picker
      - name: Patch the user-selected latest 15.9 project only
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q zxc2003-15_9-full-backup-custody.zip -d extracted
          python3 - <<'PY'
          from pathlib import Path
          backup = Path("extracted/android_project/app/src/main/java/com/alkamel/distribution/BackupActivity.java")
          s = backup.read_text(encoding="utf-8")
          old_mime = '            intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/json", "text/json", "text/plain"});'
          if old_mime in s:
              s = s.replace(old_mime, '            // Do not restrict MIME: some Android 7 file providers label JSON as octet-stream.\n            // The selected content is validated as JSON before import.')
          if 'intent.putExtra(Intent.EXTRA_MIME_TYPES' in s or 'intent.setType("*/*")' not in s:
              raise SystemExit("Restore picker validation failed.")
          backup.write_text(s, encoding="utf-8")

          report = Path("extracted/android_project/app/src/main/java/com/alkamel/distribution/ReportActivity.java")
          r = report.read_text(encoding="utf-8")
          start = r.find("// Page 3 and any overflow pages")
          end = r.find("ByteArrayOutputStream out", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate page 3 PDF section.")
          section = r[start:end]
          if "drawColoredCardCounts(" in section:
              raise SystemExit("Page 3 already has a counts renderer; refusing to duplicate it.")
          amount_line = next((line for line in section.splitlines() if "drawPdfText" in line and "amount" in line), None)
          if amount_line is None:
              raise SystemExit("Page 3 amount line not found.")
          indent = amount_line[:len(amount_line)-len(amount_line.lstrip())]
          changed = amount_line.replace("rowY+23", "rowY+21").replace("rowY + 23", "rowY + 21")
          section = section.replace(amount_line, changed + "\n" + indent + "drawColoredCardCounts(canvas, x, rowY + 43, colWidth, a);", 1)
          section = section.replace("rowY+43", "rowY+56").replace("rowY + 43", "rowY + 56")
          section = section.replace("rowY=yy+row*47", "rowY=yy+row*58").replace("rowY = yy + row * 47", "rowY = yy + row * 58")
          r = r[:start] + section + r[end:]
          helper = '''
          /** Display per-shop card counts in the fixed 100/200/250/500 order. */
          private void drawColoredCardCounts(android.graphics.Canvas canvas, int x, int baseline, int colWidth, int[] counts) {
              int[] colors = new int[]{Color.rgb(192,57,43), Color.rgb(142,68,173), Color.rgb(22,160,90), Color.rgb(20,170,205)};
              android.graphics.Paint p = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
              p.setTextSize(11f);
              p.setTypeface(android.graphics.Typeface.create(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD));
              String[] labels = new String[]{String.valueOf(counts[0]), String.valueOf(counts[1]), String.valueOf(counts[2]), String.valueOf(counts[3])};
              float totalWidth = 0;
              for (int i=0;i<4;i++) totalWidth += p.measureText(labels[i]);
              totalWidth += p.measureText(" - ") * 3;
              float xPos = x + Math.max(0, (colWidth-totalWidth)/2f);
              for (int i=0;i<4;i++) {
                  p.setColor(colors[i]);
                  canvas.drawText(labels[i], xPos, baseline, p);
                  xPos += p.measureText(labels[i]);
                  if (i<3) {
                      p.setColor(Color.DKGRAY);
                      canvas.drawText(" - ", xPos, baseline, p);
                      xPos += p.measureText(" - ");
                  }
              }
          }
          '''
          anchor = "    private int drawPdfHeader("
          if anchor not in r:
              raise SystemExit("PDF helper insertion point not found.")
          r = r.replace(anchor, helper + "\n" + anchor, 1)
          if "drawColoredCardCounts(canvas, x, rowY + 56, colWidth, a);" not in r:
              raise SystemExit("Page 3 count row validation failed.")
          report.write_text(r, encoding="utf-8")
          print("Patched only 15.9: Android 7 restore picker + per-shop colored card counts on page 3.")
          PY
          (cd extracted && zip -qr ../zxc2003-15_14-page3-counts-restore-fix.zip android_project)
          unzip -t zxc2003-15_14-page3-counts-restore-fix.zip
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'
      - name: Build debug APK
        run: gradle --no-daemon -p extracted/android_project assembleDebug
      - name: Commit fixed project archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zxc2003-15_14-page3-counts-restore-fix.zip
          git commit -m "Restore colored shop card counts on PDF page three" || echo "Archive unchanged"
          git push origin HEAD:fix/restore-json-picker
      - uses: actions/upload-artifact@v4
        with:
          name: alkamel-15-14-page3-counts-restore-fix
          path: |
            extracted/android_project/app/build/outputs/apk/debug/*.apk
            zxc2003-15_14-page3-counts-restore-fix.zip
          if-no-files-found: error
