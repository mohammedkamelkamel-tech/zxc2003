name: Build AlKamel 15.14 - preserve restore fix and restore page-3 card counts

on:
  push:
    branches:
      - fix/restore-json-picker
    paths:
      - '.github/workflows/fix-restore-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-json-picker
      - name: Patch latest 15.12 project only
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q zxc2003-15_12-card-count-spacing-fix.zip -d extracted
          python3 - <<'PY'
          from pathlib import Path
          backup = Path("extracted/android_project/app/src/main/java/com/alkamel/distribution/BackupActivity.java")
          s = backup.read_text(encoding="utf-8")
          old_mime = '            intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/json", "text/json", "text/plain"});'
          if old_mime in s:
              s = s.replace(old_mime, '            // Do not restrict MIME: some Android 7 file providers label JSON as octet-stream.\n            // The selected content is validated as JSON before import.')
          if 'intent.putExtra(Intent.EXTRA_MIME_TYPES' in s or 'intent.setType("*/*")' not in s:
              raise SystemExit("Restore picker validation failed; no APK will be built.")
          backup.write_text(s, encoding="utf-8")

          report = Path("extracted/android_project/app/src/main/java/com/alkamel/distribution/ReportActivity.java")
          r = report.read_text(encoding="utf-8")
          # Patch only the page-3 per-shop rows; keep pages 1-2 and all data logic untouched.
          page3_start = r.find("// Page 3 and any overflow pages")
          if page3_start < 0:
              raise SystemExit("Page-3 PDF section not found.")
          page3_end = r.find("ByteArrayOutputStream out", page3_start)
          if page3_end < 0:
              raise SystemExit("PDF output boundary not found.")
          page3 = r[page3_start:page3_end]
          lines = page3.splitlines()
          amount_i = next((i for i,line in enumerate(lines) if "drawPdfText" in line and "amount" in line), None)
          stride_i = next((i for i,line in enumerate(lines) if "rowY=yy+row*" in line or "rowY = yy + row *" in line), None)
          if amount_i is None or stride_i is None:
              raise SystemExit("Could not identify page-3 amount row and spacing.")
          indent = lines[amount_i][:len(lines[amount_i])-len(lines[amount_i].lstrip())]
          amount_line = lines[amount_i].replace("rowY+23", "rowY+21").replace("rowY + 23", "rowY + 21")
          lines[amount_i] = amount_line
          lines.insert(amount_i + 1, indent + "drawColoredCardCounts(canvas, x, rowY + 43, colWidth, a);")
          line_i = next((i for i in range(amount_i + 2, len(lines)) if "canvas.drawLine(x,rowY+" in lines[i] or "canvas.drawLine(x, rowY +" in lines[i]), None)
          if line_i is None:
              raise SystemExit("Page-3 separator line not found.")
          lines[line_i] = lines[line_i].replace("rowY+43", "rowY+56").replace("rowY + 43", "rowY + 56")
          lines[stride_i] = lines[stride_i].replace("row*47", "row*58").replace("row * 47", "row * 58")
          page3 = "\n".join(lines) + "\n"
          r = r[:page3_start] + page3 + r[page3_end:]
          if "private void drawColoredCardCounts(" not in r:
              helper = '''
          /** Draw the four per-shop card counts in fixed 100/200/250/500 order. */
          private void drawColoredCardCounts(android.graphics.Canvas canvas, int x, int baseline, int[] counts) {
              int[] colors = new int[]{Color.rgb(192, 57, 43), Color.rgb(142, 68, 173), Color.rgb(22, 160, 90), Color.rgb(20, 170, 205)};
              android.graphics.Paint paint = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
              paint.setTextSize(12f);
              paint.setTypeface(android.graphics.Typeface.create(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD));
              float cursor = x;
              for (int i = 0; i < 4; i++) {
                  paint.setColor(colors[i]);
                  String value = String.valueOf(counts[i]);
                  canvas.drawText(value, cursor, baseline, paint);
                  cursor += paint.measureText(value);
                  if (i < 3) {
                      paint.setColor(Color.rgb(100, 116, 139));
                      canvas.drawText("-", cursor, baseline, paint);
                      cursor += paint.measureText("-");
                  }
              }
          }
          '''
              anchor = '    private void exportReportFile() {'
              if anchor not in r:
                  raise SystemExit("PDF helper insertion point not found.")
              r = r.replace(anchor, helper + "\n" + anchor, 1)
          if "drawColoredCardCounts(canvas, x, rowY + 43, a);" not in r:
              raise SystemExit("Page-3 colored counts validation failed.")
          report.write_text(r, encoding="utf-8")
          print("Validated: Android 7 JSON picker retained; page 3 now shows colored 100-200-250-500 counts under each shop value.")
          PY
          (cd extracted && zip -qr ../zxc2003-15_14-page3-counts-restore-fix.zip android_project)
          unzip -t zxc2003-15_14-page3-counts-restore-fix.zip
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'
      - name: Build debug APK
        run: gradle --no-daemon -p extracted/android_project assembleDebug
      - name: Commit fixed project archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zxc2003-15_14-page3-counts-restore-fix.zip
          git commit -m "Restore colored shop card counts on PDF page three" || echo "Archive unchanged"
          git push origin HEAD:fix/restore-json-picker
      - uses: actions/upload-artifact@v4
        with:
          name: alkamel-15-14-page3-counts-restore-fix
          path: |
            extracted/android_project/app/build/outputs/apk/debug/*.apk
            zxc2003-15_14-page3-counts-restore-fix.zip
          if-no-files-found: error
